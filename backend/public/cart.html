<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Baytak Noor — Cart</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="max-w-3xl py-6">
    <a href="index.html" class="back-link">← Back to Home</a>
    <h1>Baytak Noor — Cart</h1>
    <div id="cartItems" class="mb-3">Loading cart…</div>
    <div class="total-row">
      <span>Estimated total:</span>
      <span id="cartTotal">Rs. 0</span>
    </div>
    <p>Final prices, shipping, discounts and availability are confirmed by the server at checkout.</p>
    <button id="checkoutBtn" class="btn w-full" disabled>Continue to Checkout</button>
  </main>
  <script src="js/config.js"></script>
  <script>
    const key = 'baytak_cart';
    const lines = (() => {
      try {
        const value = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(value) ? value.filter(item => item && typeof item.variantId === 'string' && Number.isInteger(item.qty) && item.qty > 0) : [];
      } catch { return []; }
    })();
    const container = document.getElementById('cartItems');
    const button = document.getElementById('checkoutBtn');
    const total = lines.reduce((sum, item) => sum + Number(item.cachedPrice || 0) * item.qty, 0);
    document.getElementById('cartTotal').textContent = `Rs. ${total.toFixed(2)}`;
    if (!lines.length) {
      container.textContent = 'Cart is empty';
    } else {
      container.replaceChildren();
      lines.forEach(item => {
        const row = document.createElement('div');
        row.className = 'cart-item';
        const label = document.createElement('span');
        label.textContent = `${item.name || item.sku || 'Product'} — Qty: ${item.qty}`;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'cart-remove';
        remove.textContent = 'Remove';
        remove.addEventListener('click', () => {
          const next = lines.filter(line => line.variantId !== item.variantId);
          localStorage.setItem(key, JSON.stringify(next));
          location.reload();
        });
        row.append(label, remove);
        container.append(row);
      });
      button.disabled = false;
    }
    button.addEventListener('click', () => { window.location.href = 'checkout.html'; });
  </script>
</body>
</html>
