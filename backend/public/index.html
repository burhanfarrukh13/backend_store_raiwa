<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Baytak Noor Storefront</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="max-w-3xl py-6">
    <h1>Baytak Noor — Storefront</h1>

    <!-- Navigation -->
    <nav class="mb-6" id="mainNav">
      <a href="index.html" class="btn mb-3">Home</a>
      <a href="categories.html" class="btn mb-3">Categories</a>
      <a href="collections.html" class="btn mb-3">Collections</a>
      <a href="cart.html" class="btn mb-3">Cart</a>
      <a href="checkout.html" class="btn mb-3">Checkout</a>
      <a href="track.html" class="btn mb-3">Track Order</a>
      <a href="contact.html" class="btn mb-3">Contact</a>
    </nav>

    <!-- Home / Products -->
    <section id="home" class="mb-6">
      <h2 id="productsHeading">Featured Products</h2>
      <div id="filterBanner" class="mb-3 hidden"></div>
      <div class="grid" id="productGrid"></div>
    </section>

    <!-- Cart -->
    <section id="cart" class="mb-6">
      <h2>Cart</h2>
      <div id="cartItems" class="mb-3">Cart is empty</div>
      <div class="total-row">
        <span>Total:</span>
        <span id="cartTotal">Rs. 0</span>
      </div>
      <button id="checkoutBtn" class="btn w-full" disabled>Continue to Checkout</button>
    </section>

    <!-- Checkout -->
    <section id="checkout" class="mb-6 hidden">
      <h2>Checkout</h2>
      <p id="checkoutStatus" role="status" aria-live="polite"></p>
      <div id="checkoutFormContainer">
        <form id="checkoutForm">
          <div class="mb-3">
            <label>Name</label><input type="text" id="customerName" required>
          </div>
          <div class="mb-3">
            <label>Email</label><input type="email" id="customerEmail" required>
          </div>
          <div class="mb-3">
            <label>Phone</label><input type="tel" id="customerPhone" required>
          </div>
          <div class="mb-3">
            <label>Payment Method</label>
            <select id="paymentMethod" required>
              <option value="cod">Cash on Delivery (PKR +250 COD fee)</option>
              <option value="bank_transfer">Bank Transfer</option>
            </select>
          </div>
          <div class="mb-3">
            <label>Coupon Code (optional)</label><input type="text" id="couponCode">
          </div>
          <div id="turnstileWidget"></div>
          <button type="submit" class="btn w-full">Place Order</button>
        </form>
      </div>
      <div id="orderConfirmation" class="mt-4 hidden">
        <h3>Order Confirmed</h3>
        <p>Order number: <span id="orderNumber"></span></p>
        <p>Total: <span id="orderTotalValue"></span></p>
        <p>Payment: <span id="paymentMethodDisplay"></span></p>
        <button onclick="window.location.href='index.html'">Continue Shopping</button>
      </div>
    </section>

    <div class="toast" id="toast">Order placed successfully!</div>

    <script src="js/config.js"></script>
    <script>
      const CART_KEY = 'baytak_cart';
      const apiBase = window.BAYTAK_CONFIG.apiBaseUrl.replace(/\/+$/, '');
      let cart = readCart();
      let turnstileToken = '';
      let turnstileWidgetId;
      if (window.BAYTAK_CONFIG.turnstileSiteKey) {
        const script = document.createElement('script');
        script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        script.async = true;
        script.defer = true;
        script.onload = () => { turnstileWidgetId = window.turnstile?.render('#turnstileWidget', {
          sitekey: window.BAYTAK_CONFIG.turnstileSiteKey,
          callback: token => { turnstileToken = token; },
          'expired-callback': () => { turnstileToken = ''; },
          'error-callback': () => { turnstileToken = ''; }
        }); };
        document.head.append(script);
      }

      function readCart() {
        try {
          const value = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
          return Array.isArray(value) ? value.filter(item =>
            item && typeof item.variantId === 'string' &&
            Number.isInteger(item.qty) && item.qty > 0
          ) : [];
        } catch { return []; }
      }

      function saveCart() {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
        renderCart();
      }

      function addToCart(variant, product) {
        const found = cart.find(item => item.variantId === variant.id);
        if (found) found.qty = Math.min(found.qty + 1, 100);
        else cart.push({
          variantId: variant.id,
          qty: 1,
          name: product.name,
          sku: variant.sku,
          cachedPrice: Number(variant.price || product.price || 0)
        });
        saveCart();
      }

      function renderCart() {
        const container = document.getElementById('cartItems');
        const button = document.getElementById('checkoutBtn');
        const total = document.getElementById('cartTotal');
        if (!container) return;
        container.replaceChildren();
        if (!cart.length) {
          container.textContent = 'Cart is empty';
          if (button) button.disabled = true;
          if (total) total.textContent = 'Rs. 0';
          return;
        }
        cart.forEach(item => {
          const row = document.createElement('div');
          row.className = 'cart-item';
          const label = document.createElement('span');
          label.textContent = `${item.name || item.sku || 'Product'} — Qty: ${item.qty}`;
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'cart-remove';
          remove.textContent = 'Remove';
          remove.addEventListener('click', () => {
            cart = cart.filter(line => line.variantId !== item.variantId);
            saveCart();
          });
          row.append(label, remove);
          container.append(row);
        });
        if (total) {
          const estimate = cart.reduce((sum, item) => sum + Number(item.cachedPrice || 0) * item.qty, 0);
          total.textContent = `Rs. ${estimate.toFixed(2)} (estimate)`;
        }
        if (button) button.disabled = false;
      }

      async function loadProducts() {
        const grid = document.getElementById('productGrid');
        const heading = document.getElementById('productsHeading');
        const filterBanner = document.getElementById('filterBanner');
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('category');
        const collection = urlParams.get('collection');
        const search = urlParams.get('search');

        if (category) {
          if (heading) heading.textContent = `Category: ${category}`;
          if (filterBanner) {
            filterBanner.innerHTML = `<span class="badge">Filtered by category: ${category}</span> <a href="index.html" class="back-link">Show all</a>`;
            filterBanner.classList.remove('hidden');
          }
        } else if (collection) {
          if (heading) heading.textContent = `Collection: ${collection}`;
          if (filterBanner) {
            filterBanner.innerHTML = `<span class="badge">Filtered by collection: ${collection}</span> <a href="index.html" class="back-link">Show all</a>`;
            filterBanner.classList.remove('hidden');
          }
        } else if (search) {
          if (heading) heading.textContent = `Search: "${search}"`;
          if (filterBanner) {
            filterBanner.innerHTML = `<span class="badge">Search results</span> <a href="index.html" class="back-link">Show all</a>`;
            filterBanner.classList.remove('hidden');
          }
        }

        try {
          const apiQuery = new URLSearchParams({ limit: '16' });
          if (category) apiQuery.set('category', category);
          if (search) apiQuery.set('search', search);

          const response = await fetch(`${apiBase}/api/store/products?${apiQuery.toString()}`);
          const body = await response.json();
          if (!response.ok) throw new Error(body.error || 'Could not load products');
          const products = Array.isArray(body.data) ? body.data : [];
          grid.replaceChildren();
          if (!products.length) {
            grid.textContent = 'No products are available right now.';
            return;
          }
          products.forEach(product => {
            const variant = (product.product_variants || []).find(item => item.stock_qty > 0);
            if (!variant) return;
            const card = document.createElement('article');
            card.className = 'product-card';
            const image = document.createElement('img');
            image.src = product.product_images?.[0]?.url || 'assets/logo.png';
            image.alt = product.product_images?.[0]?.alt_text || product.name;
            const heading = document.createElement('h3');
            heading.textContent = product.name;
            const price = document.createElement('div');
            price.className = 'price';
            price.textContent = `Rs. ${Number(variant.price || product.price).toFixed(2)}`;
            const add = document.createElement('button');
            add.type = 'button';
            add.className = 'btn w-full';
            add.textContent = 'Add to Cart';
            add.addEventListener('click', () => addToCart(variant, product));
            card.append(image, heading, price, add);
            grid.append(card);
          });
          if (!grid.childElementCount) grid.textContent = 'Products are currently out of stock.';
        } catch (error) {
          grid.textContent = `${error.message}. Check the API URL and backend availability.`;
        }
      }

      document.getElementById('checkoutBtn')?.addEventListener('click', () => {
        if (!cart.length) return;
        document.getElementById('checkout').classList.remove('hidden');
        document.getElementById('checkout').scrollIntoView({ behavior: 'smooth' });
      });

      document.getElementById('checkoutForm')?.addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const submit = form.querySelector('button[type="submit"]');
        const status = document.getElementById('checkoutStatus');
        submit.disabled = true;
        status.textContent = 'Submitting your order…';
        try {
          let key = sessionStorage.getItem('baytak_checkout_idempotency');
          if (!key) {
            key = crypto.randomUUID();
            sessionStorage.setItem('baytak_checkout_idempotency', key);
          }
          const response = await fetch(`${apiBase}/api/store/checkout`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Idempotency-Key': key },
            body: JSON.stringify({
              customer_name: document.getElementById('customerName').value,
              customer_email: document.getElementById('customerEmail').value,
              customer_phone: document.getElementById('customerPhone').value,
              payment_method: document.getElementById('paymentMethod').value,
              coupon_code: document.getElementById('couponCode').value,
              turnstile_token: turnstileToken,
              variant_ids: cart.map(item => item.variantId),
              quantities: cart.map(item => item.qty)
            })
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || 'Order could not be placed');
          document.getElementById('checkoutForm').classList.add('hidden');
          document.getElementById('orderConfirmation').classList.remove('hidden');
          document.getElementById('orderNumber').textContent = result.order_number;
          document.getElementById('orderTotalValue').textContent = `Rs. ${result.total}`;
          document.getElementById('paymentMethodDisplay').textContent =
            document.getElementById('paymentMethod').value === 'cod' ? 'Cash on Delivery' : 'Bank Transfer';
          status.textContent = '';
          cart = [];
          localStorage.removeItem(CART_KEY);
          sessionStorage.removeItem('baytak_checkout_idempotency');
          renderCart();
        } catch (error) {
          status.textContent = error.message || 'Order could not be placed.';
          if (turnstileWidgetId !== undefined) window.turnstile?.reset(turnstileWidgetId);
          turnstileToken = '';
        } finally {
          submit.disabled = false;
        }
      });

      renderCart();
      loadProducts();
    </script>
  </div>
</body>
</html>
