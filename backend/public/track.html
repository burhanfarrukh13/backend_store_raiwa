<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Baytak Noor — Track Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="max-w-3xl py-6">
    <a href="index.html" class="back-link">← Back to Home</a>
    <h1>Baytak Noor — Track Order</h1>

    <div id="orderDetails" class="mb-6">
      <p>Enter your order number to track your order.</p>
      <div class="mb-3">
        <label for="orderId">Order number</label>
        <input type="text" id="orderId" placeholder="e.g. BN-261111-001054" autocomplete="off" required>
      </div>
      <div class="mb-3">
        <label for="orderPhone">Phone used at checkout</label>
        <input type="tel" id="orderPhone" autocomplete="tel" required>
      </div>
      <p id="trackStatusMessage" role="status" aria-live="polite"></p>
      <button id="trackButton" class="btn w-full" type="button">Track Order</button>
    </div>

    <div id="orderInfo" class="hidden">
      <h2>Order #<span id="trackOrderNumber"></span></h2>
      <div class="order-detail">
        <span>Status:</span>
        <span id="trackOrderStatus"></span>
      </div>
      
      <div class="order-detail">
        <span>Payment:</span>
        <span id="trackPayment"></span>
      </div>
      
      <div class="order-detail">
        <span>Total:</span>
        <span id="trackTotal"></span>
      </div>
      
      <div class="order-detail">
        <span>Created:</span>
        <span id="trackCreated"></span>
      </div>
    </div>

    <div class="toast" id="toast">Order found!</div>

    <script src="js/config.js"></script>
    <script>
      const apiBase = window.BAYTAK_CONFIG.apiBaseUrl.replace(/\/+$/, '');
      document.getElementById('trackButton').addEventListener('click', async () => {
        const orderNumber = document.getElementById('orderId').value.trim();
        const phone = document.getElementById('orderPhone').value.trim();
        const status = document.getElementById('trackStatusMessage');
        status.textContent = 'Checking order…';
        try {
          const query = new URLSearchParams({ order_number: orderNumber, phone });
          const response = await fetch(`${apiBase}/api/store/track?${query}`);
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Order not found');
          const data = result.data;
          document.getElementById('orderDetails').classList.add('hidden');
          document.getElementById('orderInfo').classList.remove('hidden');
          document.getElementById('trackOrderNumber').textContent = data.order_number;
          document.getElementById('trackOrderStatus').textContent = data.status || 'Unknown';
          document.getElementById('trackPayment').textContent = data.payment_status || 'Unknown';
          document.getElementById('trackTotal').textContent = `Rs. ${data.total}`;
          document.getElementById('trackCreated').textContent = new Date(data.created_at).toLocaleString();
          status.textContent = '';
        } catch (error) {
          status.textContent = error.message || 'Order tracking is unavailable.';
        }
      });
    </script>
  </div>
</body>
</html>
