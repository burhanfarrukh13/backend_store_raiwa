<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Baytak Noor — Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="max-w-3xl py-6">
    <a href="/" class="back-link">← Back to Home</a>
    <h1>Baytak Noor — Checkout</h1>

    <form id="checkoutForm">
      <input type="hidden" id="orderTotal">
      <div class="mb-3">
        <label>Name</label><input type="text" id="customerName" required>
      </div>
      <div class="mb-3">
        <label>Email</label><input type="email" id="customerEmail" required>
      </div>
      <div class="mb-3">
        <label>Phone</label><input type="tel" id="customerPhone" required>
      </div>
      <div class="mb-3">
        <label>Payment Method</label>
        <select id="paymentMethod" required>
          <option value="cod">Cash on Delivery (PKR +250 COD fee)</option>
          <option value="bank_transfer">Bank Transfer</option>
        </select>
      </div>
      <div class="mb-3">
        <label>Coupon Code (optional)</label><input type="text" id="couponCode">
      </div>
      <button type="submit" class="btn w-full">Place Order</button>
    </form>

    <div id="orderConfirmation" class="mt-4 hidden">
      <h3>Order Confirmed</h3>
      <p>Order number: <span id="orderNumber"></span></p>
      <p>Total: <span id="orderTotalValue"></span></p>
      <p>Payment: <span id="paymentMethodDisplay"></span></p>
      <button onclick="window.location.href='/'">Continue Shopping</button>
    </div>

    <div class="toast" id="toast">Order placed successfully!</div>

    <script>
      let cart = JSON.parse(localStorage.getItem('baytak_cart') || '[]');

      function formatPaymentMethod(method) {
        return method === 'cod' ? 'Cash on Delivery' : 'Bank Transfer';
      }

      const checkoutForm = document.getElementById('checkoutForm');
      if (checkoutForm) {
        checkoutForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          
          if (cart.length === 0) {
            alert('Cart is empty. Add items before checking out.');
            return;
          }
          
          const customerName = document.getElementById('customerName').value;
          const customerEmail = document.getElementById('customerEmail').value;
          const customerPhone = document.getElementById('customerPhone').value;
          const paymentMethod = document.getElementById('paymentMethod').value;
          const couponCode = document.getElementById('couponCode').value;
          
          const variantIds = cart.map(item => item.variantId);
          const quantities = cart.map(item => item.qty);
          
          const res = await fetch('/api/store/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              orderNumber: 'ORD-' + Date.now(),
              customerName,
              customerEmail,
              customerPhone,
              paymentMethod,
              coupon_code: couponCode,
              total: 0,
              variant_ids: variantIds,
              quantities
            })
          });

          const result = await res.json();
          
          if (result.success) {
            document.getElementById('checkoutForm').classList.add('hidden');
            document.getElementById('orderConfirmation').classList.remove('hidden');
            document.getElementById('orderNumber').textContent = result.order_number;
            document.getElementById('orderTotalValue').textContent = `Rs. ${result.total}`;
            document.getElementById('paymentMethodDisplay').textContent = formatPaymentMethod(paymentMethod);
            
            cart = [];
            localStorage.removeItem('baytak_cart');
            
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
          } else {
            alert('Order failed: ' + (result.error || 'unknown error'));
          }
        });
      }
      
      function initCheckout() {
        const variantPrice = cart.reduce((sum, item) => sum + (item.cachedPrice || 0), 0);
        document.getElementById('orderTotal').value = variantPrice;
      }
      
      initCheckout();
    </script>
  </div>
</body>
</html>
