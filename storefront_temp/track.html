<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Baytak Noor — Track Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="max-w-3xl py-6">
    <a href="/" class="back-link">← Back to Home</a>
    <h1>Baytak Noor — Track Order</h1>

    <div id="orderDetails" class="mb-6">
      <p>Enter your order number to track your order.</p>
      <div class="mb-3">
        <label>Order ID</label>
        <input type="text" id="orderId" placeholder="e.g. ORD123456">
      </div>
      <button class="btn w-full" onclick="trackOrder()">Track Order</button>
    </div>

    <div id="orderInfo" class="hidden">
      <h2>Order #<span id="trackOrderNumber"></span></h2>
      
      <div class="order-detail">
        <span>Customer:</span>
        <span id="trackCustomerName"></span>
      </div>
      
      <div class="order-detail">
        <span>Status:</span>
        <span id="trackStatus"></span>
      </div>
      
      <div class="order-detail">
        <span>Payment:</span>
        <span id="trackPayment"></span>
      </div>
      
      <div class="order-detail">
        <span>Total:</span>
        <span id="trackTotal"></span>
      </div>
      
      <div class="order-detail">
        <span>Created:</span>
        <span id="trackCreated"></span>
      </div>
    </div>

    <div class="toast" id="toast">Order found!</div>

    <script>
      async function trackOrder() {
        const orderId = document.getElementById('orderId').value.trim();
        if (!orderId) {
          alert('Please enter an order ID.');
          return;
        }
        
        const res = await fetch(`/api/store/track?order_id=${orderId}`);
        const { data, error } = await res.json();
        
        if (error) {
          alert('Order not found: ' + error);
          return;
        }
        
        document.getElementById('orderDetails').classList.add('hidden');
        document.getElementById('orderInfo').classList.remove('hidden');
        
        document.getElementById('trackOrderNumber').textContent = data.order_number || orderId;
        document.getElementById('trackCustomerName').textContent = data.customer_name || 'N/A';
        
        const statusEl = document.getElementById('trackStatus');
        if (data.status) {
          statusEl.textContent = data.status;
        }
        
        document.getElementById('trackPayment').textContent = data.payment_method || 'N/A';
        document.getElementById('trackTotal').textContent = data.total ? `Rs. ${data.total}` : 'N/A';
      }
      
      document.getElementById('trackOrderNumber').textContent = '';
    </script>
  </div>
</body>
</html>
